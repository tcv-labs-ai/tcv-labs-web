<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b10" />
    <title>TCV Labs</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="splash">
      <header class="brand">
        <img
          class="logo"
          src="./assets/tcv-labs-logo.png"
          alt="TCV Labs"
        />
      </header>

      <section class="experiments" aria-labelledby="experiments-title">
        <p class="eyebrow">App experiments</p>
        <h1 id="experiments-title">Tools for what comes next.</h1>

        <div class="experiment-grid">
          <a
            class="experiment-card"
            href="https://thecryptovortex.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open The Crypto Vortex"
          >
            <span class="app-icon vortex-mark">
              <img
                src="./assets/crypto-vortex-skull.png"
                alt=""
              />
            </span>
            <span class="card-copy">
              <span class="card-title">The Crypto Vortex</span>
              <span class="card-description">Cryptocurrency, market strategy, and AI innovation.</span>
              <span class="card-action">Open app <span aria-hidden="true">↗</span></span>
            </span>
          </a>

          <a
            class="experiment-card"
            href="https://moneyclock.tcvlabs.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open MoneyClock"
          >
            <img
              class="app-icon"
              src="./assets/money-clock-icon.png"
              alt=""
            />
            <span class="card-copy">
              <span class="card-title">MoneyClock</span>
              <span class="card-description">Watch estimated interest accrue over time.</span>
              <span class="card-action">Open app <span aria-hidden="true">↗</span></span>
            </span>
          </a>

          <div class="experiment-card is-upcoming">
            <span class="app-icon continuum-mark" aria-hidden="true">
              <img
                src="./assets/continuum-icon.png"
                alt=""
              />
            </span>
            <span class="card-copy">
              <span class="card-title">Continuum</span>
              <span class="card-description">A local-first memory layer for people and AI agents.</span>
              <span class="card-action">In development</span>
            </span>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>&copy; <span id="year"></span> TCV Labs</span>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
